# boris.gb 2026-10-30 16:03 - example config of wafpanel: SafeLine instances, alert channels, alert rules, SIEM forwarding and the web panel
#
# Secrets live in separate files (*_file, mode 0600); relative paths are resolved
# from the directory of this file. ${ENV_VAR} references are expanded.

state_file: /var/lib/wafpanel/state.json

# Language of alert texts: en (default) or ru. The web UI has its own switch.
language: en

http:
  listen: 127.0.0.1:9188 # /healthz and /metrics (Prometheus)

web:
  listen: 0.0.0.0:12443
  # Without tls_cert/tls_key a self-signed certificate is created in data_dir/tls.
  # The panel can reuse the certificate SafeLine keeps for your sites; it is
  # re-read when the file changes, so renewals need no restart.
  # tls_cert: /data/safeline/resources/nginx/certs/cert_1.crt
  # tls_key: /data/safeline/resources/nginx/certs/cert_1.key
  data_dir: /var/lib/wafpanel # users, session key, rules saved in the UI, alert history, audit log
  session_ttl: 12h
  # plain_http: true # only with listen on 127.0.0.1 (local development, reverse proxy)

instances:
  - id: prod
    name: Production
    base_url: https://192.0.2.10:9443
    # When base_url is an IP but the console certificate is issued for a name:
    tls_server_name: waf.example.com
    # ca_file: secrets/ca.pem      # only for a self-signed console certificate
    token_file: secrets/prod.token # API token from the SafeLine console
    poll_interval: 15s
    lookback: 2m   # re-read window: records reach the API up to tens of seconds late
    page_size: 100 # SafeLine accepts at most 100
    max_pages: 20
    backfill: false # do not send existing events on the first start
    # Traffic analytics when SafeLine runs on this host: locations, clients,
    # response codes, endpoints, referrers and upstream errors from tengine's
    # logs, kept for 90 days. Turn on the access log of each application in
    # SafeLine to include it.
    logs:
      access_dir: /data/safeline/logs/nginx/safeline
      error_log: /data/safeline/logs/nginx/error.log

channels:
  - name: tg-soc
    type: telegram
    telegram:
      bot_token_file: secrets/telegram.token
      chat_id: "-1001234567890"
      # thread_id: 42                  # topic in a forum group
      # api_url: https://tg-proxy.example.com

  - name: mail-soc
    type: email
    email:
      host: smtp.example.com
      port: 587
      tls: starttls # starttls | tls | none
      username: waf-alerts@example.com
      password_file: secrets/smtp.password
      from: waf-alerts@example.com
      to: [soc@example.com]

  - name: hook
    type: webhook
    webhook:
      url: https://hooks.example.com/waf
      format: json # json (full payload) | slack (Slack/Mattermost/Rocket.Chat)
      secret_file: secrets/webhook.secret # adds X-WAFPanel-Signature: sha256=<hmac>
      headers:
        X-Source: wafpanel

# Rules saved in the web UI (data_dir/rules.yaml) take precedence over these.
rules:
  # A burst of attacks from one IP.
  - name: burst-from-ip
    severity: warning
    threshold: 20
    window: 5m
    group_by: src_ip # src_ip | host | instance | none
    cooldown: 30m
    channels: [tg-soc]

  # Dangerous attack types, even a single one: backdoor, code execution,
  # code/command injection, XXE, path traversal, request smuggling.
  - name: critical-attack
    severity: critical
    attack_types: [5, 7, 8, 9, 17, 20, 36]
    threshold: 1
    cooldown: 15m
    channels: [tg-soc, mail-soc, hook]

  # An attack got through (site in Monitoring mode or the rule does not block).
  - name: attack-passed
    severity: warning
    actions: [pass]
    threshold: 1
    group_by: host
    cooldown: 1h
    channels: [tg-soc]

  # A site under a massive attack.
  - name: site-under-attack
    severity: critical
    hosts: ["*.example.com"]
    threshold: 300
    window: 5m
    group_by: host
    cooldown: 1h
    channels: [tg-soc, mail-soc]

siem:
  # Wazuh decodes JSON only without a syslog header.
  - name: wazuh
    network: tcp # udp | tcp | tls
    address: siem.example.com:514
    format: json # cef | json
    header: none # rfc5424 | none
    framing: newline # newline | octet (RFC 6587, tcp/tls)
    # only_denied: true
    # ca_file: secrets/siem-ca.pem # for network: tls

# boris.gb 2026-10-30 18:15 - traffic analytics settings
analytics:
  # Copied by deploy/install.sh from SafeLine's detector image.
  geoip_db: /var/lib/wafpanel/GeoLite2-City.mmdb
  retention: 2160h # 90 days
  backfill: true   # read the rotated logs still on disk on the first start
